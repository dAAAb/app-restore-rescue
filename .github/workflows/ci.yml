name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit publication inputs
        run: python3 scripts/privacy_audit.py
      - name: Test archive boundaries
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate packaging shell syntax
        run: bash -n scripts/build-release.sh
      - name: Test app core with synthetic data and mock device tools
        run: swift test
